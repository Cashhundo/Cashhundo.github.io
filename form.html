<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <form action="register_account.html" method="post" id="registration_form">
        <fieldset>
            <legend>Registration Information</legend>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" autofocus required autocomplete="on"><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required placeholder="At least 6 letters or numbers" pattern="[a-zA-Z0-9]{6,}" title="Password must be at least 6 letters or numbers"><br>
            <label for="verify_password">Verify Password:</label>
            <input type="password" id="verify_password" name="verify_password" required><br>
        </fieldset>
        <fieldset>
            <legend>Member Information</legend>
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" required autocomplete="on"><br>
            <label for="state">State:</label>
            <input type="text" id="state" name="state" required maxlength="2" placeholder="2-character code"><br>
            <label for="zip">ZIP Code:</label>
            <input type="text" id="zip" name="zip" required placeholder="5 or 9 digits" pattern="\d{5}(-\d{4})?"><br>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="999-999-9999" pattern="\d{3}-\d{3}-\d{4}"><br>
        </fieldset>
        <fieldset>
            <legend>Membership Information</legend>
            <label for="membership_type">Membership Type:</label>
            <select id="membership_type" name="membership_type">
                <option value="junior">Junior</option>
                <option value="regular">Regular</option>
                <option value="charter">Charter</option>
            </select><br>
            <label for="starting_date">Starting Date:</label>
            <input type="date" id="starting_date" name="starting_date" required><br>
            <label for="tickets">Tickets for Guests:</label>
            <input type="number" id="tickets" name="tickets" min="1" max="4" value="2"><br>
        </fieldset>
        <fieldset>
            <legend>How Did You Hear About Us?</legend>
            <label><input type="checkbox" name="hear_about" value="search_engine"> Search engine</label><br>
            <label><input type="checkbox" name="hear_about" value="social_media"> Social media</label><br>
            <label><input type="checkbox" name="hear_about" value="email"> Email</label><br>
            <label><input type="checkbox" name="hear_about" value="friend_colleague"> Friend or colleague</label><br>
        </fieldset>
        <fieldset>
            <legend>Comments</legend>
            <textarea id="comments" name="comments" placeholder="If you have any comments, please enter them here."></textarea>
        </fieldset>
        <fieldset id="buttons">
            <legend>Submit Your Membership</legend>
            <label></label>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset Fields">
        </fieldset>
    </form>
</body>
</html>
